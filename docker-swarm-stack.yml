version: '3.8'

services:
  # Database - Deploy on Manager node for data persistence
  database:
    image: neo4j:5.26
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_db_tx__log_rotation__retention__policy=false
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 10
    networks:
      - genai_network
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # LLM Service - Deploy on GPU-enabled nodes if available
  llm:
    image: ollama/ollama:latest
    networks:
      - genai_network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.gpu == true
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # Model Puller - Run once to pull models
  pull-model:
    image: genai-stack/pull-model:latest
    build:
      context: .
      dockerfile: pull_model.Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://llm:11434
      - LLM=${LLM:-llama2}
    networks:
      - genai_network
    deploy:
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager

  # API Service - Main backend API
  api:
    image: genai-stack/api:latest
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      - NEO4J_URI=neo4j://database:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=http://llm:11434
      - LLM=${LLM:-llama2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence_transformer}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-"https://api.smith.langchain.com"}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
    ports:
      - "8504:8504"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 http://localhost:8504/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - genai_network
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Support Bot - Main chat application
  bot:
    image: genai-stack/bot:latest
    build:
      context: .
      dockerfile: bot.Dockerfile
    environment:
      - NEO4J_URI=neo4j://database:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=http://llm:11434
      - LLM=${LLM:-llama2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence_transformer}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-"https://api.smith.langchain.com"}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
    ports:
      - "8501:8501"
    networks:
      - genai_network
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # PDF Bot - PDF processing application
  pdf_bot:
    image: genai-stack/pdf-bot:latest
    build:
      context: .
      dockerfile: pdf_bot.Dockerfile
    environment:
      - NEO4J_URI=neo4j://database:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=http://llm:11434
      - LLM=${LLM:-llama2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence_transformer}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-"https://api.smith.langchain.com"}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
    ports:
      - "8503:8503"
    networks:
      - genai_network
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Loader - Data loading application
  loader:
    image: genai-stack/loader:latest
    build:
      context: .
      dockerfile: loader.Dockerfile
    environment:
      - NEO4J_URI=neo4j://database:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=http://llm:11434
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence_transformer}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-"https://api.smith.langchain.com"}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
    ports:
      - "8502:8502"
    networks:
      - genai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Frontend - Client application
  front-end:
    image: genai-stack/frontend:latest
    build:
      context: .
      dockerfile: front-end.Dockerfile
    ports:
      - "8505:8505"
    networks:
      - genai_network
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Load Balancer - Nginx reverse proxy
  load-balancer:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - genai_network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Monitoring - Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - genai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Monitoring - Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - genai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  genai_network:
    driver: overlay
    attachable: true

volumes:
  neo4j_data:
  prometheus_data:
  grafana_data: